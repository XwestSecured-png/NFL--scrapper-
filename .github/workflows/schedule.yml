name: NFL Schedule Scraper

on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests gspread google-auth-oauthlib google-auth-httplib2
      
      - name: Run NFL scraper
        env:
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        run: python nfl_scraper.py
